# Configuración de Pages CMS (app.pagescms.org)
# Define lo que se ve en el panel: la sección "Blog" con un formulario por artículo.
# Cada artículo se guarda como un archivo .md en blog/articulos/ y GitHub publica la web solo.

media:
  input: img/blog          # carpeta donde se guardan las imágenes que subas
  output: /img/blog        # cómo se escriben en la web

content:
  - name: articulos
    label: Blog
    type: collection
    path: blog/articulos
    filename: "{primary}.md"        # el nombre del archivo sale del título; la dirección web también, salvo que se llene "Dirección"
    view:
      primary: title
      fields: [title, categoria, date, borrador]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Título
        type: string
        required: true
        description: "Lo que se ve en la card y arriba del artículo. Ideal: menos de 60 caracteres."

      - name: description
        label: Descripción para Google
        type: text
        required: true
        description: "Entre 120 y 155 caracteres. Sale en Google y en la card del blog."

      - name: resumen
        label: Resumen para la card (opcional)
        type: text
        description: "1 o 2 frases que invitan a leer. Si lo dejas vacío, se usa la descripción para Google."

      - name: respuesta
        label: Respuesta rápida
        type: text
        description: "2 o 3 frases que respondan el título. Va en el recuadro de arriba y es lo que más citan Google y las IA."

      - name: date
        label: Fecha de publicación
        type: date
        required: true

      - name: categoria
        label: Tema
        type: select
        required: true
        options:
          values:
            - { value: google-maps, label: Google Maps }
            - { value: resenas, label: Reseñas }
            - { value: tarjetas-nfc, label: Tarjetas NFC }
            - { value: salud, label: Salud }
            - { value: paginas-web, label: Páginas web }

      - name: servicio
        label: Servicio que se ofrece a mitad del artículo
        type: select
        options:
          values:
            - { value: tarjetas-nfc, label: Tarjetas NFC de reseñas }
            - { value: ficha-google-maps, label: Ficha de Google Maps }
            - { value: gestion-resenas, label: Gestión de reseñas }
            - { value: salud, label: Planes para salud }
            - { value: paginas-web, label: Páginas web }

      - name: miniatura
        label: Miniatura
        type: image
        description: "1200 x 630 px, JPG, menos de 200 KB. Sale en la card, arriba del artículo y al compartir en WhatsApp o redes."

      - name: miniatura_alt
        label: Descripción de la miniatura
        type: string
        description: "Qué muestra la imagen, para quien no la ve. Ej.: Tarjeta NFC sobre el mesón de una peluquería."

      - name: body
        label: Contenido
        type: rich-text
        description: "Usa Título 2 para cada sección. El recuadro del servicio se pone solo a mitad del texto."

      - name: preguntas
        label: Preguntas frecuentes
        type: object
        list: true
        description: "De 3 a 5 preguntas reales de tus clientes, con respuestas de 1 a 3 frases."
        fields:
          - { name: pregunta, label: Pregunta, type: string }
          - { name: respuesta, label: Respuesta, type: text }

      - name: destacado
        label: Destacar arriba en el blog
        type: boolean
        default: false
        description: "Si no marcas ninguno, se destaca el más nuevo."

      - name: titulo_seo
        label: Título para Google (opcional)
        type: string
        description: "Solo si quieres que en Google salga distinto. Termina en | Vlue. Máximo 60 caracteres."

      - name: direccion
        label: Dirección (opcional)
        type: string
        description: "Lo que va después de /blog/. Ej.: telemedicina-en-chile-ley-y-google-maps. Corta, sin tildes y con la palabra clave. Si la dejas vacía, sale del título. No la cambies después de publicar: los enlaces viejos dejarían de funcionar."

      - name: borrador
        label: Borrador (no publicar todavía)
        type: boolean
        default: false

  # ---------- Páginas de enlaces (link en bio de clientes) ----------
  # Cada página es un archivo .md en enlaces/ y queda en vluetechservices.cl/enlaces/<nombre>/
  # Para un cliente nuevo: crea una entrada nueva copiando los datos de "ejemplo-buscador"
  # o "ejemplo-vitrina". Déjala en Borrador hasta que el cliente la apruebe.
  - name: enlaces
    label: Enlaces de clientes
    type: collection
    path: enlaces
    filename: "{primary}.md"        # el nombre del archivo es la dirección: /enlaces/<nombre>/
    view:
      primary: title
      fields: [title, diseno, borrador]
    fields:
      - name: title
        label: Nombre del negocio o profesional
        type: string
        required: true
        description: "Va arriba en la página, en la pestaña y en el contacto guardado. Al crear, también define la dirección (ej.: dra-perez)."

      - name: diseno
        label: Diseño
        type: select
        required: true
        default: buscador
        options:
          values:
            - { value: buscador, label: "Buscador (portada blanca y buscador de Google)" }
            - { value: vitrina, label: "Vitrina (portada de color, accesos rápidos y horario)" }

      - name: borrador
        label: Borrador (no publicar todavía)
        type: boolean
        default: true
        description: "Mientras esté marcado, solo se ve en tu computador."

      - name: mostrar_en_google
        label: Mostrar en Google
        type: boolean
        default: false
        description: "Solo para clientes sin web propia. Si no, la página no sale en Google (igual funciona desde Instagram, QR y NFC)."

      - name: color
        label: Color principal
        type: string
        default: "#07209f"
        description: "Código del color de la marca, con #. Ej.: #2f5d50. Sale en títulos, botones y fondo."

      - name: logo
        label: Logo o foto
        type: image
        description: "Cuadrado, JPG o PNG de menos de 200 KB (así también se guarda en el contacto). En Buscador, un logo PNG o SVG sin fondo sale además como marca de agua."

      - name: inicial
        label: Letra de fondo (solo Vitrina)
        type: string
        description: "La letra gigante del fondo de la portada. Si la dejas vacía, se usa la primera letra del nombre."

      - name: etiqueta
        label: Etiqueta sobre el título
        type: string
        description: "Rubro y comuna. Ej.: Psicóloga · Ñuñoa"

      - name: titulo
        label: Título grande
        type: text
        required: true
        description: "Corto. Ej.: Tu sonrisa, sin esperas. Para elegir dónde cambia de línea, aprieta Enter ahí. En Vitrina puede ser el nombre."

      - name: titulo_color
        label: Palabras del título en color (opcional)
        type: string
        description: "Escríbelas igual que en el título. Ej.: sin esperas"

      - name: bajada
        label: Bajada
        type: text
        description: "Una línea: qué hace y dónde. Para elegir dónde cambia de línea, aprieta Enter ahí. Si no, la página corta las líneas parejas sola."

      - name: description
        label: Descripción al compartir
        type: text
        description: "Lo que sale al compartir el enlace por WhatsApp o redes (y en Google si está activado)."

      - name: whatsapp
        label: WhatsApp del cliente
        type: string
        required: true
        description: "Con código de país, sin + ni espacios. Ej.: 56912345678"

      - name: saludo
        label: Saludo al inicio de cada mensaje
        type: string
        default: "Hola, "
        description: "Va antes de cada mensaje de WhatsApp, con un espacio al final. Ej.: Hola, vengo de tu Instagram."

      - name: mensaje_whatsapp
        label: Mensaje del botón WhatsApp (solo Vitrina)
        type: string
        description: "Ej.: Quiero agendar una hora."

      - name: botones_titulo
        label: Título de los botones (solo Vitrina)
        type: string
        description: "Ej.: ¿En qué te ayudo?"

      - name: ayuda
        label: Texto de ayuda sobre los botones
        type: string
        description: "Ej.: ¿Qué necesitas? Toca la tuya y te respondemos por WhatsApp."

      - name: botones
        label: Botones según la situación
        type: object
        list: true
        description: "De 3 a 6. Cada uno abre WhatsApp con su mensaje, o un enlace si lo pones."
        fields:
          - { name: texto, label: Texto del botón, type: string, description: "Como lo diría el cliente. Ej.: Tengo una urgencia dental" }
          - { name: resaltar, label: Parte en negrita, type: string, description: "Escrita igual que en el texto. Ej.: urgencia" }
          - { name: mensaje, label: Mensaje de WhatsApp, type: text, description: "Lo que le llega al cliente. Ej.: Tengo una urgencia dental, ¿tienen hora hoy?" }
          - { name: enlace, label: Enlace (opcional), type: string, description: "Si lo llenas, el botón abre este enlace en vez de WhatsApp." }
          - { name: cliente, label: Para clientes, type: boolean, default: false, description: "Lo mueve al plegable «¿Ya eres cliente?» (ej.: dejar una reseña, pagar)." }

      - name: oferta
        label: Oferta o regalo (opcional)
        type: object
        description: "Un recuadro destacado. Si no tiene título, no se muestra."
        fields:
          - { name: etiqueta, label: Etiqueta, type: string, description: "Ej.: Este mes · Sin costo" }
          - { name: titulo, label: Título, type: string }
          - { name: texto, label: Texto, type: string }
          - { name: boton, label: Texto del botón, type: string }
          - { name: mensaje, label: Mensaje de WhatsApp, type: text }
          - { name: enlace, label: Enlace (opcional), type: string }

      - name: horario
        label: Horario (solo Vitrina)
        type: object
        list: true
        description: "Con esto la página muestra «Abierto ahora» o «Cerrado · abre a las…» con la hora de Chile."
        fields:
          - name: dias
            label: Días
            type: select
            options:
              multiple: true
              values:
                - { value: lun, label: Lunes }
                - { value: mar, label: Martes }
                - { value: mie, label: Miércoles }
                - { value: jue, label: Jueves }
                - { value: vie, label: Viernes }
                - { value: sab, label: Sábado }
                - { value: dom, label: Domingo }
          - { name: abre, label: Abre, type: string, description: "Formato 24 h. Ej.: 09:00" }
          - { name: cierra, label: Cierra, type: string, description: "Ej.: 19:30" }

      - name: clientes_titulo
        label: Título del plegable para clientes
        type: string
        description: "Junta los datos de transferencia y los botones marcados «Para clientes». Si lo dejas vacío: ¿Ya eres cliente? (ej. para salud: ¿Ya eres paciente?)"

      - name: clientes_bajada
        label: Texto bajo el título del plegable
        type: string
        description: "Ej.: Datos para pagar y dejar tu reseña"

      - name: transferencia
        label: Datos de transferencia
        type: object
        description: "Van dentro del plegable «¿Ya eres cliente?», en este orden. Al tocar «Copiar datos» se copian solo los datos, uno por línea, sin «RUT:» ni «Número de cuenta:»."
        fields:
          - { name: nombre, label: Nombre o razón social, type: string, description: "Ej.: VLUE TECH SERVICES SpA" }
          - { name: rut, label: RUT, type: string, description: "Escríbelo como quieras: en la página siempre sale y se copia con puntos y guion (78.514.356-6)." }
          - { name: banco, label: Banco, type: string, description: "Ej.: Mercado Pago" }
          - { name: tipo, label: Tipo de cuenta, type: string, description: "Ej.: Cuenta Vista, Cuenta Corriente, Cuenta RUT" }
          - { name: numero, label: Número de cuenta, type: string }
          - { name: email, label: Correo para el comprobante, type: string }

      - name: datos_titulo
        label: Título de otros datos para copiar
        type: string
        description: "Ej.: Datos para transferir"

      - name: datos_copiar
        label: Datos para copiar
        type: object
        list: true
        description: "Otros datos con botón Copiar (dirección, código de descuento, teléfono...). Para transferencias usa «Datos de transferencia»."
        fields:
          - { name: etiqueta, label: Nombre del dato, type: string, description: "Ej.: RUT" }
          - { name: valor, label: Dato, type: string, description: "Lo que se copia. Ej.: 12.345.678-9" }

      - name: enlaces_titulo
        label: Título de los enlaces
        type: string
        description: "Ej.: Antes de venir"

      - name: enlaces
        label: Enlaces
        type: object
        list: true
        fields:
          - { name: texto, label: Texto, type: string }
          - { name: url, label: "Dirección (https://...)", type: string }

      - name: contacto
        label: Guardar contacto
        type: object
        description: "Datos del botón «Guardar contacto»: se guardan en la agenda del celular de quien lo toca."
        fields:
          - { name: guardar, label: Mostrar el botón, type: boolean, default: true }
          - { name: nombre, label: Nombre de la persona (opcional), type: string, description: "Si lo dejas vacío, se guarda con el nombre del negocio." }
          - { name: cargo, label: Cargo o rubro, type: string }
          - { name: telefono, label: Teléfono, type: string, description: "Con +56. En Vitrina también activa el botón Llamar." }
          - { name: email, label: Correo, type: string }
          - { name: web, label: Web, type: string }
          - { name: direccion, label: Dirección, type: string, description: "En Vitrina sale bajo el horario." }
          - { name: nota, label: Nota, type: text, description: "Texto que queda en la ficha del contacto. Ej.: Horario lun a vie 9 a 19 h." }
          - { name: foto, label: Foto del contacto (opcional), type: image, description: "JPG o PNG de menos de 200 KB. Si no, se usa el logo." }

      - name: redes
        label: Redes
        type: object
        fields:
          - { name: instagram, label: Instagram, type: string }
          - { name: facebook, label: Facebook, type: string }
          - { name: tiktok, label: TikTok, type: string }
          - { name: linkedin, label: LinkedIn, type: string }
          - { name: google_maps, label: Ficha de Google Maps, type: string, description: "En Vitrina activa el botón «Cómo llegar»." }

      - name: credito
        label: Mostrar «Página hecha por Vlue»
        type: boolean
        default: true
